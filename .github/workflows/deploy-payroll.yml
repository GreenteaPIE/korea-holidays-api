name: Deploy korea-payroll-api

# korea-payroll-api 를 이 저장소의 Cloudflare Secrets 로 배포한다 (같은 Cloudflare 계정).
# GitHub Secrets 는 저장소끼리 공유되지 않아서, 키를 두 번 넣지 않으려고 여기서 대신 배포한다.
# 하루 한 번 최신 main 을 배포하고, Actions 탭에서 바로 실행할 수도 있다.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * *' # 매일 03:37 (한국 시간)

concurrency: deploy-payroll

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: GreenteaPIE/korea-payroll-api
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 테스트가 깨진 코드는 배포하지 않는다
      - run: npm run typecheck
      - run: npm test
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
