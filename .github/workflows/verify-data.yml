name: Verify Holiday Data

# 매주 월요일 오전 9시 17분(KST)과 공휴일 데이터가 바뀌어 푸시될 때 공공데이터포털 특일정보와 비교하고,
# 차이가 있으면 이슈를 만든다.
on:
  schedule:
    - cron: '17 0 * * 1'
  push:
    branches: [main]
    paths:
      - src/data/holidays.ts
      - scripts/verify-*.ts
      - .github/workflows/verify-data.yml
  workflow_dispatch:

env:
  HAS_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY != '' }}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: verify
        run: node scripts/verify-holidays.ts report.md
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          VERIFY_ALL: ${{ github.event_name != 'schedule' }}
      - if: steps.verify.outputs.mismatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 공휴일 데이터 불일치 감지
        run: |
          number=$(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
      # 모든 연도가 다시 일치하면 열려 있던 불일치 이슈를 닫는다
      - if: steps.verify.outputs.mismatch == 'false' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 공휴일 데이터 불일치 감지
        run: |
          for number in $(gh issue list --state open --search "in:title $TITLE" --json number --jq '.[].number'); do
            gh issue close "$number" --comment "✅ 공식 데이터와 다시 일치합니다 (${{ github.sha }})"
          done
