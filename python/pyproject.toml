[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "korea-holidays"
version = "0.3.0"
description = "대한민국 공휴일·영업일 계산 라이브러리 — 대체공휴일·임시공휴일·연차 추천 지원"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "GreenteaPIE" }]
keywords = ["korea", "holidays", "public-holidays", "business-days", "korean", "calendar", "공휴일", "영업일"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://korea-holidays-api.greenteapie2023.workers.dev"
Documentation = "https://github.com/GreenteaPIE/korea-holidays-api/tree/main/python#readme"
Repository = "https://github.com/GreenteaPIE/korea-holidays-api"
Issues = "https://github.com/GreenteaPIE/korea-holidays-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/korea_holidays"]
